name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'Nama Agent'
        required: true
        default: 'ayye'
      agent_description:
        description: 'Deskripsi Agent'
        required: true
        default: 'ayye AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity || echo "ClawHub install exited non-zero - check if rate limited or skill unavailable"

      - name: Debug folder structure
        run: |
          pwd
          ls -la
          if [ -d "skills/verified-agent-identity" ]; then
            echo "Skill folder exists"
            ls -laR skills/verified-agent-identity
          else
            echo "skills/verified-agent-identity NOT created - install likely failed"
            exit 1
          fi

      - name: Install dependencies
        run: |
          cd skills/verified-agent-identity/scripts || { echo "scripts folder missing"; exit 1; }
          npm install || { echo "npm install failed"; exit 1; }
          echo "Dependencies installed"

      - name: Create Ethereum Identity
        run: |
          cd skills/verified-agent-identity/scripts || exit 1
          echo "Attempting to create identity..."
          node createNewEthereumIdentity.js && echo "Identity created" || echo "Creation skipped or failed (may already exist)"

      - name: Link Human to Agent
        run: |
          cd skills/verified-agent-identity/scripts || exit 1

          AGENT_NAME="${{ github.event.inputs.agent_name }}"
          AGENT_DESC="${{ github.event.inputs.agent_description }}"

          CHALLENGE=$(jq -n --arg name "$AGENT_NAME" --arg desc "$AGENT_DESC" '{name: $name, description: $desc}') || { echo "jq failed"; exit 1; }

          echo "Challenge: $CHALLENGE"

          node manualLinkHumanToAgent.js --challenge "$CHALLENGE" || echo "Link step failed - likely needs interactive wallet or env vars; check output for link"
