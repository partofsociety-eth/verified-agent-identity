name: Verify Human Identity
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Memaksa GitHub Actions menggunakan Node.js 24 sesuai saran peringatan
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Tetap v4, tapi dijalankan di Node 24 oleh env di atas

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Update ke versi 24

      - name: Install Dependencies
        run: |
          cd scripts
          npm install

      - name: Create and Link Identity
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          AGENT_NAME: "ayye"
          AGENT_DESC: "ayye AI Agent"
          CI: true # Mode non-interaktif
        run: |
          cd scripts
          
          # Gunakan 'yes' untuk bypass konfirmasi prompt (Y/N)
          # Dan printf untuk menyuplai input teks otomatis
          yes | printf "$AGENT_NAME\n$AGENT_DESC\n" | node createNewEthereumIdentity.js || echo "Identity setup finished"

          # Buat Challenge JSON
          CHALLENGE=$(jq -n --arg name "$AGENT_NAME" --arg desc "$AGENT_DESC" '{name: $name, description: $desc}')
          
          # Eksekusi Linking
          printf "$AGENT_NAME\n$AGENT_DESC\n" | node manualLinkHumanToAgent.js --challenge "$CHALLENGE"
