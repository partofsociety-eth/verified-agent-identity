name: Verify Human Identity
on:  
  workflow_dispatch:    
    inputs:      
      agent_name:        
        description: 'Agent Name'        
        required: true        
        default: 'ayye'      
      agent_description:        
        description: 'Agent Description'        
        required: true        
        default: 'ayye AI Agent'

jobs:  
  verify:    
    runs-on: ubuntu-latest    
    steps:      
      - name: Checkout repository        
        uses: actions/checkout@v4
      - name: Setup Node.js 20 # Node 20 lebih stabil untuk kebanyakan package saat ini
        uses: actions/setup-node@v4        
        with:          
          node-version: '20'

      - name: Install ClawHub & Skill
        run: |
          npx -y clawhub@latest install verified-agent-identity
          
      - name: Check and Install Dependencies
        run: |
          TARGET_DIR=$(find . -type d -name "scripts" | grep "verified-agent-identity" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then
            echo "Error: Scripts folder not found!"
            exit 1
          fi
          echo "Found scripts at: $TARGET_DIR"
          cd "$TARGET_DIR"
          npm install
          echo "SCRIPT_PATH=$TARGET_DIR" >> $GITHUB_ENV

      - name: Create Ethereum Identity
        env:
          CI: true # Memberitahu Node bahwa ini lingkungan robot
        run: |
          cd "${{ env.SCRIPT_PATH }}"
          node createNewEthereumIdentity.js || echo "Identity already exists or failed, moving on..."

      - name: Link Human to Agent
        env:
          CI: true
          AGENT_NAME: ${{ github.event.inputs.agent_name }}
          AGENT_DESC: ${{ github.event.inputs.agent_description }}
        run: |
          cd "${{ env.SCRIPT_PATH }}"
          CHALLENGE=$(jq -n --arg name "$AGENT_NAME" --arg desc "$AGENT_DESC" '{name: $name, description: $desc}')
          echo "Processing Challenge: $CHALLENGE"
          
          node manualLinkHumanToAgent.js --challenge "$CHALLENGE"
