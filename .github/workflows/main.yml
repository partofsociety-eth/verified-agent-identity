name: Billions Network Agent Verification
on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'Nama Agent'
        required: true
        default: 'ayye'
      agent_description:
        description: 'Deskripsi Agent'
        required: true
        default: 'ayye AI Agent'

jobs:
  verify-identity:
    runs-on: ubuntu-latest
    env:
      # Mengatasi peringatan depresiasi Node 20
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Agar script tidak menunggu input manual (Non-Interactive)
      CI: true 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: |
          cd scripts
          npm install

      - name: Execute Verification
        env:
          # Pastikan kamu sudah isi ini di GitHub Secrets!
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          AGENT_NAME: ${{ github.event.inputs.agent_name }}
          AGENT_DESC: ${{ github.event.inputs.agent_description }}
        run: |
          cd scripts
          
          # 1. Buat Ethereum Identity (Otomatis jawab 'y' jika ditanya)
          echo "Step 1: Creating Identity..."
          yes | node createNewEthereumIdentity.js || echo "Identity already exists"

          # 2. Buat Challenge JSON dengan JQ
          CHALLENGE=$(jq -n --arg name "$AGENT_NAME" --arg desc "$AGENT_DESC" '{name: $name, description: $desc}')
          echo "Challenge Data: $CHALLENGE"

          # 3. Linking Human to Agent
          # Kita suapi input Nama dan Deskripsi lewat pipe agar tidak 'hang'
          echo "Step 2: Linking Agent..."
          printf "$AGENT_NAME\n$AGENT_DESC\n" | node manualLinkHumanToAgent.js --challenge "$CHALLENGE"
          
          echo "Verification Process Completed!"
