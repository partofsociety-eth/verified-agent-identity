name: Verify Human Identity
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          # Masuk ke folder scripts dan install package
          cd scripts
          npm install

      - name: Create and Link Identity
        env:
          # Pastikan kamu sudah menambah PRIVATE_KEY di Settings > Secrets > Actions
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          AGENT_NAME: "ayye"
          AGENT_DESC: "ayye AI Agent"
        run: |
          cd scripts
          
          # 1. Buat Identity secara otomatis
          # Jika script meminta konfirmasi (y/n), kita gunakan 'yes' command
          yes | node createNewEthereumIdentity.js || echo "Identity setup finished"

          # 2. Buat Challenge JSON
          CHALLENGE=$(jq -n --arg name "$AGENT_NAME" --arg desc "$AGENT_DESC" '{name: $name, description: $desc}')
          echo "Challenge created: $CHALLENGE"

          # 3. Link Human to Agent secara Otomatis
          # Kita gunakan printf untuk menyuapi input jika script meminta nama/deskripsi secara manual
          printf "$AGENT_NAME\n$AGENT_DESC\n" | node manualLinkHumanToAgent.js --challenge "$CHALLENGE"
