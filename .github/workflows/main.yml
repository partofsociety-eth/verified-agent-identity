name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'Agent name'
        required: true
        default: 'Ayye AI Agent'
        type: string

      agent_description:
        description: 'Agent description'
        required: true
        default: 'Ayye AI Agent'
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity

      - name: Install script dependencies
        working-directory: ./scripts
        run: npm install

      - name: Create new Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Link Human to Agent
        env:
          AGENT_NAME: ${{ inputs.agent_name }}
          AGENT_DESC: ${{ inputs.agent_description }}
        run: |
          node scripts/manualLinkHumanToAgent.js \
            --challenge '{"name":"'"${AGENT_NAME}"'","description":"'"${AGENT_DESC}"'"}'
